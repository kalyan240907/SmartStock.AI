<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartStock AI — Simple Business Management for Everyone</title>
  <meta name="description" content="Manage Stock Easily. Grow Your Business Smarter. Simple inventory and trade network for shops, restaurants, traders, and factories with voice control and multi-language support.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230d9488' stroke-width='2'><rect x='4' y='4' width='16' height='16' rx='2'/><rect x='9' y='9' width='6' height='6'/></svg>">

  <!-- Instant Preconnects for Zero Latency -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Times New Roman"', 'Times', 'serif'],
            serif: ['"Times New Roman"', 'Times', 'serif']
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            },
            navy: {
              800: '#f0f9ff',
              900: '#ffffff',
              950: '#ffffff'
            }
          }
        }
      }
    };
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (Compiles inline JSX in-memory) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/custom.css">

  <!-- Core Data & Service Scripts -->
  <script src="js/data/i18n.js"></script>
  <script src="js/data/sectors.js"></script>
  <script src="js/data/initialData.js"></script>
  <script src="js/data/tradeNetwork.js"></script>
  <script src="js/data/subscriptionsData.js"></script>
  <script src="js/data/startupGuideData.js"></script>
  <script src="js/data/trendsData.js"></script>
  <script src="js/services/storage.js"></script>
  <script src="js/services/voiceService.js"></script>
  <script src="js/services/insightsEngine.js"></script>
  <script src="js/services/tradeService.js"></script>
  <script src="js/services/geminiService.js"></script>
  <script src="js/components/Icons.js"></script>
  <script src="js/components/Charts.js"></script>
</head>
<body class="bg-white text-sky-900 antialiased min-h-screen flex flex-col selection:bg-sky-500 selection:text-white">
  <div id="root">
    <!-- Instant 0ms Preloader (Eliminates blank buffering while React initializes) -->
    <div id="smartstock-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
      <div style="width: 56px; height: 56px; border-radius: 16px; background-color: #0284c7; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.3); margin-bottom: 16px;">
        <svg style="width: 32px; height: 32px; color: #ffffff;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.29 7 12 12 20.71 7"></polyline>
          <line x1="12" y1="22" x2="12" y2="12"></line>
        </svg>
      </div>
      <div style="font-size: 24px; font-weight: 900; color: #082f49; letter-spacing: -0.5px;">
        SmartStock<span style="color: #0284c7;">AI</span>
      </div>
      <div style="margin-top: 12px; display: flex; align-items: center; gap: 8px;">
        <div style="width: 14px; height: 14px; border: 2px solid #bae6fd; border-top-color: #0284c7; border-radius: 50%; animation: ssSpin 0.7s linear infinite;"></div>
        <span style="font-size: 12px; font-weight: 600; color: #0284c7;">Loading Simple Stock System...</span>
      </div>
      <style>
        @keyframes ssSpin { to { transform: rotate(360deg); } }
      </style>
    </div>
  </div>

  <!-- Main React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const { Icons, Charts, SECTORS, BUSINESS_TYPES, StorageService, VoiceService, InsightsEngine, TradeService, GeminiService, LANGUAGES, PLANS, t } = window.SmartStock;

    // Toast Container (Pure White & Sky Blue Minimalist)
    function ToastContainer({ toasts, removeToast }) {
      return (
        <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-md w-full pointer-events-none">
          {toasts.map(t => (
            <div
              key={t.id}
              className="pointer-events-auto p-4 rounded-2xl shadow-2xl bg-white border-2 border-sky-300 flex items-start gap-3 transition-all duration-300"
            >
              <div className="mt-0.5 flex-shrink-0">
                {t.type === 'error' && <Icons.AlertTriangle className="w-5 h-5 text-sky-600" />}
                {t.type === 'warning' && <Icons.AlertTriangle className="w-5 h-5 text-sky-500" />}
                {t.type === 'info' && <Icons.Info className="w-5 h-5 text-sky-500" />}
                {(!t.type || t.type === 'success') && <Icons.CheckCircle className="w-5 h-5 text-sky-500" />}
              </div>
              <div className="flex-1">
                {t.title && <h5 className="font-bold text-sm leading-snug text-sky-950">{t.title}</h5>}
                <p className="text-xs text-sky-700 mt-0.5 leading-relaxed">{t.message}</p>
              </div>
              <button onClick={() => removeToast(t.id)} className="text-sky-400 hover:text-sky-700 transition">
                <Icons.X className="w-4 h-4" />
              </button>
            </div>
          ))}
        </div>
      );
    }

    // Master App Component
    function App() {
      // Auto Persistent Login: If user has already completed login/registration, show dashboard directly!
      const isAlreadyLoggedIn = StorageService.isLoggedIn && StorageService.isLoggedIn();
      const [currentView, setCurrentView] = useState(isAlreadyLoggedIn ? 'dashboard' : 'landing');
      const [navHistory, setNavHistory] = useState([]);
      const [currentLang, setCurrentLang] = useState(StorageService.getLanguage());
      const [profile, setProfile] = useState(StorageService.getProfile());
      const [activeSector, setActiveSector] = useState(StorageService.getActiveSector());
      const [subscriptionPlan, setSubscriptionPlan] = useState(StorageService.getSubscription());
      const [isAdminMode, setIsAdminMode] = useState(StorageService.isAdminMode());
      const [products, setProducts] = useState(StorageService.getProducts());
      const [transactions, setTransactions] = useState(StorageService.getTransactions());
      const [tradeRequests, setTradeRequests] = useState(StorageService.getTradeRequests());
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [toasts, setToasts] = useState([]);

      // Voice Modal & Assistant State
      const [voiceModalOpen, setVoiceModalOpen] = useState(false);
      const [isVoiceListening, setIsVoiceListening] = useState(false);
      const [voiceTranscript, setVoiceTranscript] = useState('');
      const [voiceConfirmation, setVoiceConfirmation] = useState(null);

      // Generic Modal State
      const [modalState, setModalState] = useState({ type: null, data: null });

      // Toast helper
      const addToast = (message, title = 'Notice', type = 'success') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, title, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 5000);
      };

      const removeToast = (id) => setToasts(prev => prev.filter(t => t.id !== id));

      // Audio Read-Aloud Helper (TTS)
      const speakText = (text, overrideLang) => {
        if (!text) return;
        const targetLang = overrideLang || currentLang;
        VoiceService.speak(text, targetLang);
        addToast(text, '🔊 ' + (LANGUAGES.find(l => l.code === targetLang)?.native || 'Voice'), 'info');
      };

      // Language Switcher with Localized Spoken Audio
      const handleLanguageChange = (langCode) => {
        StorageService.setLanguage(langCode);
        setCurrentLang(langCode);
        const langObj = LANGUAGES.find(l => l.code === langCode);
        addToast(`${t('language', langCode)}: ${langObj?.native} (${langObj?.label})`, t('success', langCode), 'success');
        const spokenMsg = t('spokenLangChanged', langCode);
        speakText(spokenMsg, langCode);
      };

      // Reactive Storage Subscriptions
      useEffect(() => {
        const unsub = StorageService.subscribe((event, payload) => {
          if (event === 'products_updated' || event === 'data_reset') {
            setProducts(StorageService.getProducts());
          }
          if (event === 'transactions_updated' || event === 'data_reset') {
            setTransactions(StorageService.getTransactions());
          }
          if (event === 'trade_requests_updated' || event === 'data_reset') {
            setTradeRequests(StorageService.getTradeRequests());
          }
          if (event === 'profile_updated' || event === 'data_reset' || event === 'sector_changed' || event === 'session_changed') {
            setProfile(StorageService.getProfile());
            const sec = StorageService.getActiveSector();
            setActiveSector(sec);
            setSubscriptionPlan(StorageService.getSubscription());
            setProducts(StorageService.getProducts(sec));
            setTransactions(StorageService.getTransactions());
            setTradeRequests(StorageService.getTradeRequests());
          }
          if (event === 'language_changed') {
            setCurrentLang(StorageService.getLanguage());
          }
          if (event === 'subscription_changed') {
            setSubscriptionPlan(StorageService.getSubscription());
          }
          if (event === 'admin_mode_changed') {
            setIsAdminMode(StorageService.isAdminMode());
            setProducts(StorageService.getProducts());
          }
        });
        return unsub;
      }, []);

      // Keep products strictly synchronized whenever activeSector changes
      useEffect(() => {
        setProducts(StorageService.getProducts(activeSector));
      }, [activeSector]);

      const handleSectorChange = (newSectorId) => {
        StorageService.setActiveSector(newSectorId, true);
        setActiveSector(newSectorId);
        const updatedProds = StorageService.getProducts(newSectorId);
        setProducts(updatedProds);
        const secObj = SECTORS.find(s => s.id === newSectorId) || { name: newSectorId };
        addToast(`Switched sector to ${secObj.name}. Loaded ${updatedProds.length} sector products.`, 'Sector Updated', 'success');
        speakText(`Sector updated to ${secObj.name}.`);
      };

      // Subscribe to Voice Events
      useEffect(() => {
        const unsubVoice = VoiceService.subscribe((event, data) => {
          if (event === 'start') {
            setIsVoiceListening(true);
            setVoiceTranscript('');
          }
          if (event === 'result') {
            setVoiceTranscript(data.transcript);
          }
          if (event === 'end') {
            setIsVoiceListening(false);
          }
          if (event === 'error') {
            setIsVoiceListening(false);
            addToast(data, 'Voice Command Notice', 'warning');
          }
          if (event === 'command') {
            handleVoiceCommandAction(data);
          }
        });
        return unsubVoice;
      }, [currentLang, activeSector]);

      // Handle Voice Command
      const handleVoiceCommandAction = (cmd) => {
        if (cmd.action === 'change_language') {
          handleLanguageChange(cmd.lang);
          setVoiceModalOpen(false);
        } else if (cmd.action === 'show_low_stock') {
          navigateTo('low-stock');
          setVoiceModalOpen(false);
          speakText(t('spokenStockLow', currentLang));
        } else if (cmd.action === 'show_all_stock') {
          navigateTo('inventory');
          setVoiceModalOpen(false);
          speakText(`${t('navMyStock', currentLang)}: ${products.length} ${t('product', currentLang)}`);
        } else if (cmd.action === 'find_supplier') {
          navigateTo('trade-network');
          setVoiceModalOpen(false);
          speakText(t('anotherBusinessHas', currentLang));
        } else if (cmd.action === 'explain_page') {
          setVoiceModalOpen(false);
          speakText(t('spokenHelpWelcome', currentLang));
        } else if (cmd.action === 'add_product_voice') {
          // Ask for confirmation before adding
          setVoiceConfirmation({
            title: `Add ${cmd.quantity} ${cmd.productName}?`,
            action: () => {
              StorageService.addProduct({
                name: cmd.productName,
                sku: 'SKU-' + Math.floor(1000 + Math.random() * 9000),
                sector: activeSector,
                category: 'General',
                quantity: cmd.quantity,
                unit: 'units',
                purchasePrice: 100,
                sellingPrice: 130,
                supplier: 'Local Sourcing',
                minStockLevel: Math.ceil(cmd.quantity * 0.5),
                dailyUsage: 2,
                leadTimeDays: 2
              });
              addToast(`Added ${cmd.quantity} of ${cmd.productName}`, 'Stock Added via Voice', 'success');
              speakText(`${t('spokenAddedStock', currentLang)} ${cmd.quantity} ${cmd.productName}`);
              setVoiceConfirmation(null);
              setVoiceModalOpen(false);
            }
          });
        }
      };

      // Active Sector Metadata
      const activeSectorObj = useMemo(() => {
        return SECTORS.find(s => s.id === activeSector) || SECTORS[0] || { id: 'grocery', name: 'Grocery & Supermarket' };
      }, [activeSector]);

      const safeProfile = profile || { businessName: 'My Business Store', sector: activeSector || 'grocery' };
      const safeSectorName = activeSectorObj?.name || 'General Enterprise';

      // Health Metrics
      const healthMetrics = useMemo(() => {
        return InsightsEngine.getInventoryHealthMetrics(products);
      }, [products]);

      // Navigation Helper with History Stack
      const navigateTo = (view, extra = null) => {
        if (view !== currentView) {
          setNavHistory(prev => [...prev, currentView]);
        }
        setCurrentView(view);
        setIsMobileMenuOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Universal Move to Previous Helper for Every Page
      const goBack = () => {
        if (navHistory.length > 0) {
          const prevView = navHistory[navHistory.length - 1];
          setNavHistory(prev => prev.slice(0, -1));
          setCurrentView(prevView);
        } else {
          setCurrentView('dashboard');
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Explicit Sign Out Helper
      const handleSignOut = () => {
        if (StorageService.logout) StorageService.logout();
        setNavHistory([]);
        setCurrentView('landing');
        addToast('Signed out of store session. Enter email anytime to log in.', 'Signed Out', 'info');
      };

      // Current Plan Object
      const currentPlanObj = useMemo(() => {
        return PLANS.find(p => p.id === subscriptionPlan) || PLANS[0];
      }, [subscriptionPlan]);

      const isFullPage = currentView === 'landing' || currentView === 'auth';

      return (
        <div className="flex flex-col min-h-screen bg-white text-sky-900 font-serif">
          <ToastContainer toasts={toasts} removeToast={removeToast} />

          {/* Voice Command Modal */}
          {voiceModalOpen && (
            <VoiceModal
              isListening={isVoiceListening}
              transcript={voiceTranscript}
              currentLang={currentLang}
              confirmation={voiceConfirmation}
              onClose={() => {
                VoiceService.stopListening();
                setVoiceModalOpen(false);
                setVoiceConfirmation(null);
              }}
              onStartListening={() => VoiceService.startListening(currentLang)}
              onStopListening={() => VoiceService.stopListening()}
              onManualCommand={(text) => VoiceService.handleParsedCommand(text, currentLang)}
            />
          )}

          {/* Floating Microphone Action Button */}
          <div className="fixed bottom-6 left-6 z-40">
            <button
              onClick={() => {
                setVoiceModalOpen(true);
                VoiceService.startListening(currentLang);
              }}
              title="Speak to SmartStock"
              className="flex items-center gap-2.5 px-4 py-3 rounded-full bg-sky-500 hover:bg-sky-600 text-white font-bold text-sm shadow-2xl hover:scale-105 active:scale-95 transition-all duration-200 border-2 border-white ring-4 ring-sky-300"
            >
              <Icons.Mic className="w-5 h-5 text-white animate-pulse" />
              <span className="hidden sm:inline font-semibold">{t('speakToSmartStock', currentLang)}</span>
            </button>
          </div>

          {isFullPage ? (
            /* Standalone Landing & Registration */
            <div className="flex-1 flex flex-col">
              {currentView === 'landing' ? (
                <LandingView
                  navigateTo={navigateTo}
                  currentLang={currentLang}
                  handleLanguageChange={handleLanguageChange}
                  speakText={speakText}
                  addToast={addToast}
                  subscriptionPlan={subscriptionPlan}
                  setSubscriptionPlan={setSubscriptionPlan}
                  setProfile={setProfile}
                  setActiveSector={handleSectorChange}
                  setProducts={setProducts}
                  openModal={(type, data) => setModalState({ type, data })}
                />
              ) : (
                <AuthView
                  navigateTo={navigateTo}
                  addToast={addToast}
                  setProfile={setProfile}
                  setSubscriptionPlan={setSubscriptionPlan}
                  currentLang={currentLang}
                  handleLanguageChange={handleLanguageChange}
                  speakText={speakText}
                />
              )}
            </div>
          ) : (
            /* Authenticated App Shell */
            <div className="flex min-h-screen">
              {/* Mobile Drawer Navigation Backdrop & Drawer */}
              {isMobileMenuOpen && (
                <div className="fixed inset-0 z-50 lg:hidden flex">
                  <div 
                    className="fixed inset-0 bg-sky-950/30 backdrop-blur-sm transition-opacity" 
                    onClick={() => setIsMobileMenuOpen(false)}
                  />
                  <div className="relative flex flex-col w-72 max-w-[85vw] bg-white text-sky-800 z-50 shadow-2xl h-full border-r border-sky-200">
                    {/* Header */}
                    <div className="p-5 border-b border-sky-200 flex items-center justify-between bg-white">
                      <div className="flex items-center gap-2.5">
                        <div className="w-8 h-8 rounded-lg bg-sky-500 flex items-center justify-center text-white font-black shadow-sm">
                          <Icons.Box className="w-5 h-5 text-white" />
                        </div>
                        <span className="font-extrabold text-sky-950 text-base">SmartStock<span className="text-sky-500">AI</span></span>
                      </div>
                      <button 
                        onClick={() => setIsMobileMenuOpen(false)}
                        className="p-1.5 rounded-lg text-sky-500 hover:text-sky-800 hover:bg-sky-50"
                      >
                        <Icons.X className="w-5 h-5" />
                      </button>
                    </div>

                    {/* Active Business Sector Card & Quick Switcher */}
                    <div className="p-3 mx-4 my-2 rounded-xl bg-sky-50 border-2 border-sky-300 space-y-1.5">
                      <div className="flex items-center justify-between text-xs text-sky-700">
                        <span className="font-bold flex items-center gap-1.5 text-sky-900">
                          <Icons.Box className="w-3.5 h-3.5 text-sky-500" />
                          <span>Field Sector</span>
                        </span>
                        <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-sky-100 text-sky-800 border border-sky-300">
                          {products.length} Products
                        </span>
                      </div>
                      <select
                        value={activeSector}
                        onChange={e => handleSectorChange(e.target.value)}
                        className="w-full bg-white border-2 border-sky-300 rounded-lg px-2 py-1.5 text-xs font-bold text-sky-950 outline-none focus:border-sky-500 cursor-pointer shadow-xs"
                        title="Select business field to view that industry's products"
                      >
                        {SECTORS.map(sec => (
                          <option key={sec.id} value={sec.id}>
                            {sec.name}
                          </option>
                        ))}
                      </select>
                      <div className="text-[11px] text-sky-600 truncate font-medium">
                        {safeProfile.businessName || 'My Business Store'}
                      </div>
                    </div>

                    {/* Nav Items */}
                    <nav className="flex-1 px-3 py-2 space-y-1 overflow-y-auto">
                      <NavItem icon={Icons.Layers} label={t('navDashboard', currentLang)} active={currentView === 'dashboard'} onClick={() => navigateTo('dashboard')} />
                      <NavItem icon={Icons.Box} label={t('navMyStock', currentLang)} active={currentView === 'inventory'} onClick={() => navigateTo('inventory')} badge={`${products.length}`} />
                      <NavItem icon={Icons.Plus} label={t('navAddProduct', currentLang)} onClick={() => { setIsMobileMenuOpen(false); setModalState({ type: 'addProduct', data: null }); }} />
                      <NavItem icon={Icons.ArrowRightLeft} label={t('navSellStock', currentLang)} onClick={() => { setIsMobileMenuOpen(false); setModalState({ type: 'stockMovement', data: null }); }} />
                      <NavItem icon={Icons.AlertTriangle} label={t('navLowStock', currentLang)} active={currentView === 'low-stock'} onClick={() => navigateTo('low-stock')} badge={healthMetrics.lowStockCount > 0 ? `${healthMetrics.lowStockCount}` : null} highlight={healthMetrics.lowStockCount > 0} />
                      <NavItem icon={Icons.Sliders} label={t('navSuggestions', currentLang)} active={currentView === 'insights'} onClick={() => navigateTo('insights')} />
                      <NavItem icon={Icons.Truck} label="Other Businesses (B2B)" active={currentView === 'trade-network'} onClick={() => navigateTo('trade-network')} badge={subscriptionPlan === 'free' ? '⭐ Upgrade' : null} />
                      <NavItem icon={Icons.Clock} label={t('navOrders', currentLang)} active={currentView === 'trade-requests'} onClick={() => navigateTo('trade-requests')} badge={`${tradeRequests.filter(r => r.status === 'Pending').length}`} />
                      <NavItem icon={Icons.BarChart3} label="Market Trends & Reports" active={currentView === 'reports'} onClick={() => navigateTo('reports')} badge={subscriptionPlan === 'free' ? '⭐ Upgrade' : null} />
                      <NavItem icon={Icons.Award} label="Market Guidelines (Top Rank)" active={currentView === 'guidelines'} onClick={() => navigateTo('guidelines')} badge="👑 Premium" />
                      <NavItem icon={Icons.Sparkles} label={t('navPlans', currentLang)} active={currentView === 'subscriptions'} onClick={() => navigateTo('subscriptions')} badge={currentPlanObj.name} />
                      <NavItem icon={Icons.HelpCircle} label={t('navHelp', currentLang)} active={currentView === 'help'} onClick={() => navigateTo('help')} />
                      <NavItem icon={Icons.Settings} label={t('navSettings', currentLang)} active={currentView === 'settings'} onClick={() => navigateTo('settings')} />
                    </nav>

                    {/* Footer */}
                    <div className="p-4 border-t border-sky-200 text-xs flex items-center justify-between text-sky-700 bg-white">
                      <div className="truncate">
                        <span className="font-semibold text-sky-950 block truncate">{safeProfile.businessName || 'My Business Store'}</span>
                        <span className="text-[10px] text-sky-500 font-bold uppercase">{currentPlanObj.name} (Active)</span>
                      </div>
                      <button onClick={handleSignOut} className="px-2.5 py-1 rounded bg-sky-100 hover:bg-sky-200 text-sky-800 font-bold text-xs border border-sky-300">
                        {t('signOut', currentLang)}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Sidebar */}
              <aside className="hidden lg:flex flex-col w-64 bg-white text-sky-800 border-r border-sky-200 flex-shrink-0 z-30 shadow-sm">
                {/* Logo & Shop Info */}
                <div className="p-5 border-b border-sky-200 bg-white">
                  <div onClick={() => navigateTo('dashboard')} className="flex items-center gap-2.5 cursor-pointer">
                    <div className="w-10 h-10 rounded-xl bg-sky-500 flex items-center justify-center text-white font-black shadow-md shadow-sky-500/20">
                      <Icons.Box className="w-6 h-6 text-white" />
                    </div>
                    <div>
                      <span className="font-extrabold text-sky-950 text-base tracking-tight">SmartStock<span className="text-sky-500">AI</span></span>
                      <span className="block text-[11px] text-sky-600 font-medium">Simple Business App</span>
                    </div>
                  </div>

                  {/* Active Business Sector Card & Quick Switcher */}
                  <div className="mt-4 p-3 rounded-xl bg-sky-50 border-2 border-sky-300 space-y-1.5">
                    <div className="flex items-center justify-between text-xs text-sky-700">

        id: 'growth',
        name: 'Upgrade Plan',
        priceLabelMonthly: '₹499',
        monthlyPrice: 499,
        badge: 'B2B & Market Trends'
      };
      const upiId = 'gandhiraman031-3@oksbi';
      const payeeName = 'SmartStock AI / Gandhi Raman';

        try {
          navigator.clipboard.writeText(upiId);
          setCopied(true);
          if (addToast) addToast(`Copied UPI ID: ${upiId} to clipboard!`, 'UPI ID Copied', 'success');
          setTimeout(() => setCopied(false), 3000);
        } catch (e) {
          if (addToast) addToast(`Official UPI ID: ${upiId}`, 'UPI ID', 'info');
        }
      };

      const handleVerifyPayment = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const cleanUtr = (utrNumber || '').trim();
        if (!cleanUtr || cleanUtr.length < 6) {
          if (addToast) addToast('Please enter your 12-digit UPI UTR / Transaction Reference number.', 'UTR Required', 'warning');
          return;
        }

        setIsVerifying(true);
        setTimeout(() => {
          StorageService.setSubscription(planObj.id);
          if (setSubscriptionPlan) setSubscriptionPlan(planObj.id);
          if (addToast) addToast(`Payment verified! Upgraded to ${planObj.name}. (UTR: ${cleanUtr})`, 'Plan Activated', 'success');
          if (speakText) speakText(`Payment verified. Your store is now upgraded to ${planObj.name}.`);
          setIsVerifying(false);
          closeModal();

                      <Icons.Zap className="w-3.5 h-3.5 text-sky-600" />

            {/* UTR Form & Actions */}
            <form onSubmit={handleVerifyPayment} className="space-y-3">

                  className="w-full bg-sky-50 border-2 border-sky-200 focus:bg-white focus:border-sky-500 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-sky-950 font-mono font-medium outline-none transition"

              <div className="flex flex-col gap-2 pt-1">

    }

    // Modal Handler
    function ModalDialog({ type, data, activeSector, products, currentLang, closeModal, addToast, navigateTo, speakText, setSubscriptionPlan }) {
      if (type === 'addProduct' || type === 'editProduct') {
        return <SimpleProductFormModal isEdit={type === 'editProduct'} initialData={data} activeSector={activeSector} currentLang={currentLang} closeModal={closeModal} addToast={addToast} />;
      }
      if (type === 'stockMovement') {
        return <SimpleStockMovementModal preselectedId={data?.productId} products={products} currentLang={currentLang} closeModal={closeModal} addToast={addToast} />;
      }
      if (type === 'tradeRequest') {
        return <SimpleTradeRequestModal supplier={data?.supplier} prefilledQty={data?.quantity} currentLang={currentLang} closeModal={closeModal} addToast={addToast} navigateTo={navigateTo} />;
      }
      if (type === 'geminiApiKey') {
        return <GeminiApiKeyModal closeModal={closeModal} addToast={addToast} currentLang={currentLang} />;
      }
      if (type === 'billing') {
        return <SmartBillingModal products={products} activeSector={activeSector} currentLang={currentLang} closeModal={closeModal} addToast={addToast} navigateTo={navigateTo} speakText={speakText} />;
      }
      if (type === 'upiPayment' || type === 'upgradePlan') {
        return (
          <UpiPaymentUpgradeModal
            planId={data?.planId || 'growth'}
            closeModal={closeModal}
            addToast={addToast}
            setSubscriptionPlan={setSubscriptionPlan}
            speakText={speakText}
            currentLang={currentLang}
          />
        );
      }
      return null;
    }

    // 1. CLEAN CENTERED ENTRY & LOGIN / REGISTRATION VIEW
    function LandingView({ navigateTo, currentLang, handleLanguageChange, speakText, addToast, subscriptionPlan, setSubscriptionPlan, setProfile, setActiveSector, setProducts }) {
      // Step: 'email' | 'plan' | 'register'
      const [step, setStep] = useState('email');
      // Auth Mode: 'login' | 'register'
      const [authMode, setAuthMode] = useState('login');
      const [regSuccessName, setRegSuccessName] = useState(null);
      const [email, setEmail] = useState(StorageService.getSavedEmail() || '');
      const [selectedPlan, setSelectedPlan] = useState(subscriptionPlan || 'free');
      const [formData, setFormData] = useState({
        businessName: '',
        sector: 'grocery',
        businessType: 'retailer',
        contactPerson: '',
        phone: '',
        location: '',
        language: currentLang || 'en'
      });

      // Handle Login Submit
      const handleLoginSubmit = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const cleanEmail = (email || '').trim().toLowerCase();
        if (!cleanEmail || !cleanEmail.includes('@')) {
          if (addToast) addToast('Please enter a valid Email ID (e.g. storeowner@gmail.com).', 'Email Required', 'warning');
          return;
        }

        // Check if this email is already registered
        const registeredUser = StorageService.getUserByEmail(cleanEmail);
        if (registeredUser && registeredUser.businessName) {
          StorageService.setSession(cleanEmail, registeredUser);
          if (registeredUser.sector) {
            StorageService.setActiveSector(registeredUser.sector, true);
            if (setActiveSector) setActiveSector(registeredUser.sector);
          }
          if (setProfile) setProfile(registeredUser);
          if (setSubscriptionPlan) setSubscriptionPlan(registeredUser.subscriptionPlan || 'free');
          if (setProducts) setProducts(StorageService.getProducts(registeredUser.sector || 'grocery'));
          if (addToast) addToast(`Welcome back, ${registeredUser.businessName}! Opening your store...`, 'Logged In', 'success');
          if (speakText) speakText(`Welcome back to ${registeredUser.businessName}.`);
          navigateTo('dashboard');
          return;
        }

        // Email not registered yet: guide user to First Time Registration
        if (addToast) addToast(`"${cleanEmail}" is not registered yet. Please complete First Time Registration.`, 'Registration Required', 'info');
        setRegSuccessName(null);
        setAuthMode('register');
        setStep('plan');
      };

      // Handle First Time Registration Start (Step 1 -> Step 2)
      const handleRegisterStart = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const cleanEmail = (email || '').trim().toLowerCase();
        if (!cleanEmail || !cleanEmail.includes('@')) {
          if (addToast) addToast('Please enter a valid Email ID (e.g. storeowner@gmail.com).', 'Email Required', 'warning');
          return;
        }

        // Check if email is already registered
        const existingUser = StorageService.getUserByEmail(cleanEmail);
        if (existingUser && existingUser.businessName) {
          if (addToast) addToast(`"${cleanEmail}" is already registered for ${existingUser.businessName}! Please login.`, 'Account Exists', 'info');
          setRegSuccessName(null);
          setAuthMode('login');
          return;
        }

        if (addToast) addToast('Email verified. Step 2: Choose your subscription plan.', 'Step 1 Complete', 'info');
        if (speakText) speakText('Please select your subscription plan.');
        setStep('plan');
      };

      // Step 2: Handle Plan Selection
      const handleSelectPlan = (planId) => {
        setSelectedPlan(planId);
        if (setSubscriptionPlan) setSubscriptionPlan(planId);
        StorageService.setSubscriptionPlan(planId);

        const planName = planId === 'free' ? 'Free Plan' : planId === 'growth' ? 'Upgrade Plan (₹499/mo)' : 'Premium Plan (₹1,499/mo)';
        if (addToast) addToast(`Selected ${planName}. Step 3: Register your business details.`, 'Plan Selected', 'info');
        setStep('register');

      // Step 3: Handle Store Registration Submit

        if (e && e.preventDefault) e.preventDefault();

        if (!bName) {

          return;

        const newProfile = {
          email: email.trim().toLowerCase(),
          businessName: bName,
          businessType: formData.businessType || 'retailer',
          sector: formData.sector || 'grocery',
          contactPerson: (formData.contactPerson || '').trim() || 'Store Manager',

          location: (formData.location || '').trim() || 'Local Market',
          language: currentLang || 'en',
          subscriptionPlan: selectedPlan || 'free',
          currency: 'INR (₹)',
          kycVerified: true,
          kycDocType: 'gstin',
          kycDocNumber: 'GSTIN' + Math.floor(1000000000 + Math.random() * 9000000000),
          registeredAt: new Date().toLocaleDateString('en-IN')
        };

        // Permanently persist registered user into database
        StorageService.registerUser(newProfile.email, newProfile);
        StorageService.setActiveSector(newProfile.sector, true);
        StorageService.setSubscriptionPlan(selectedPlan);
        if (setActiveSector) setActiveSector(newProfile.sector);
        if (setProducts) setProducts(StorageService.getProducts(newProfile.sector));

        if (addToast) addToast(`Registration complete for ${bName}! Please login to enter your store dashboard.`, 'Registration Complete', 'success');
        if (speakText) speakText(`Registration complete for ${bName}. Please login with your email ID to enter.`);

        // Move to Login screen so user logs in again then moves to homepage!
        setRegSuccessName(bName);
        setAuthMode('login');
        setStep('email');
        setEmail(newProfile.email);
      };

            <div className="flex items-center gap-2.5">
              <div className="w-10 h-10 rounded-xl bg-sky-500 flex items-center justify-center text-white font-black shadow-md shadow-sky-500/20">
                <Icons.Box className="w-6 h-6 text-white" />
              </div>
              <div>
                <span className="font-extrabold text-xl tracking-tight text-sky-950">
                  SmartStock<span className="text-sky-500">AI</span>
                </span>
                <span className="block text-[11px] text-sky-600 font-medium">Universal Business Management</span>
              </div>

            {/* Language Selector */}
            <div className="flex items-center gap-1.5 bg-white border border-sky-200 rounded-xl px-3 py-1.5 shadow-sm">
              <Icons.Globe className="w-4 h-4 text-sky-600" />
              <select
                value={currentLang}
                onChange={e => handleLanguageChange(e.target.value)}
                className="bg-transparent text-xs font-bold text-sky-900 outline-none cursor-pointer"
              >
                {LANGUAGES.map(l => (
                  <option key={l.code} value={l.code}>{l.native} ({l.label})</option>
                ))}
              </select>
            </div>
          </header>

          {/* Main Centered Content */}
          <main className="flex-1 flex items-center justify-center p-4 sm:p-8">
            {/* STEP 1: WELCOME, COMPANY NAME & EMAIL LOGIN / REGISTRATION (IN CENTER) */}
            {step === 'email' && (
              <div className="w-full max-w-md bg-white border-2 border-sky-200 rounded-3xl p-8 sm:p-10 shadow-2xl shadow-sky-500/10 text-center space-y-6">
                <div className="w-16 h-16 rounded-2xl bg-sky-500 text-white mx-auto flex items-center justify-center shadow-lg shadow-sky-500/25">
                  <Icons.Box className="w-8 h-8 text-white" />
                </div>

                <div>
                  <span className="text-xs uppercase tracking-widest text-sky-600 font-bold block mb-1">
                    Welcome to
                  </span>
                  <h1 className="text-3xl sm:text-4xl font-black text-sky-950 tracking-tight">
                    SmartStock<span className="text-sky-500">AI</span>
                  </h1>
                  <p className="text-xs text-sky-600 mt-1.5 font-medium">
                    Universal Stock Intelligence & Predictive Management
                  </p>
                </div>

                {/* Registration Success Banner: Shown when redirected to login after completing registration */}
                {regSuccessName && authMode === 'login' && (
                  <div className="p-3.5 rounded-2xl bg-sky-50 border-2 border-sky-400 text-sky-950 text-xs flex items-center gap-2.5 text-left">
                    <Icons.CheckCircle className="w-5 h-5 text-sky-600 flex-shrink-0" />
                    <div>
                      <span className="font-bold block text-sky-950">Registration Complete for {regSuccessName}!</span>
                      <span className="text-[11px] text-sky-700">Please click "Login to My Store" below to enter your store dashboard.</span>
                    </div>
                  </div>
                )}

                {/* Mode Switcher Tabs: Login vs First Time Registration */}
                <div className="grid grid-cols-2 p-1 bg-sky-50 border border-sky-200 rounded-2xl text-xs font-bold">
                  <button
                    type="button"
                    onClick={() => { setAuthMode('login'); }}
                    className={`py-2 rounded-xl transition cursor-pointer ${authMode === 'login' ? 'bg-sky-500 text-white shadow-sm' : 'text-sky-700 hover:text-sky-950'}`}
                  >
                    🔑 Login
                  </button>
                  <button
                    type="button"
                    onClick={() => { setAuthMode('register'); setRegSuccessName(null); }}
                    className={`py-2 rounded-xl transition cursor-pointer ${authMode === 'register' ? 'bg-sky-500 text-white shadow-sm' : 'text-sky-700 hover:text-sky-950'}`}
                  >
                    📝 First Time Register
                  </button>
                </div>

                {/* LOGIN MODE */}
                {authMode === 'login' ? (
                  <div className="pt-1 text-left">
                    <h2 className="text-lg font-bold text-sky-950 mb-1">Business Login</h2>
                    <p className="text-xs text-sky-600 mb-4">Enter your registered Email ID to access your store</p>

                    <form onSubmit={handleLoginSubmit} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-sky-900 mb-1.5">
                          Email ID *
                        </label>
                        <input
                          type="email"
                          required
                          autoFocus
                          value={email}
                          onChange={e => setEmail(e.target.value)}
                          placeholder="e.g. storeowner@gmail.com"
                          className="w-full bg-white border-2 border-sky-200 rounded-xl px-4 py-3 text-sm text-sky-950 placeholder-sky-400 focus:border-sky-500 focus:ring-4 focus:ring-sky-100 outline-none transition font-medium"
                        />
                      </div>

                      <button
                        type="submit"
                        className="w-full py-3.5 rounded-xl font-bold text-sm bg-sky-500 hover:bg-sky-600 text-white transition shadow-lg shadow-sky-500/25 flex items-center justify-center gap-2 cursor-pointer"
                      >
                        <span>Login to My Store →</span>
                      </button>
                    </form>

                    <div className="pt-3 text-center">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('register'); setRegSuccessName(null); }}
                        className="text-xs text-sky-600 hover:text-sky-950 font-bold underline cursor-pointer"
                      >
                        First time user? Click here to Register your Business →
                      </button>
                    </div>

                    <div className="mt-4 p-3 rounded-xl bg-sky-50 border border-sky-200 text-center">
                      <span className="text-[11px] text-sky-700 block">
                        Once logged in, your store session is remembered automatically for every visit.
                      </span>
                    </div>
                  </div>
                ) : (
                  /* FIRST TIME REGISTRATION START (STEP 1) */
                  <div className="pt-1 text-left">
                    <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sky-100 border border-sky-300 text-xs font-bold text-sky-700 mb-2">
                      <span>Step 1 of 3</span>
                    </div>
                    <h2 className="text-lg font-bold text-sky-950 mb-1">First Time Business Registration</h2>
                    <p className="text-xs text-sky-600 mb-4">Enter your business email to set up your store and plan</p>

                    <form onSubmit={handleRegisterStart} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-sky-900 mb-1.5">
                          Business Email ID *
                        </label>
                        <input
                          type="email"
                          required
                          autoFocus
                          value={email}
                          onChange={e => setEmail(e.target.value)}
                          placeholder="e.g. storeowner@gmail.com"
                          className="w-full bg-white border-2 border-sky-200 rounded-xl px-4 py-3 text-sm text-sky-950 placeholder-sky-400 focus:border-sky-500 focus:ring-4 focus:ring-sky-100 outline-none transition font-medium"
                        />
                      </div>

                      <button
                        type="submit"
                        className="w-full py-3.5 rounded-xl font-bold text-sm bg-sky-500 hover:bg-sky-600 text-white transition shadow-lg shadow-sky-500/25 flex items-center justify-center gap-2 cursor-pointer"

                        <span>Continue to Plan Selection (Step 2) →</span>

                    <div className="pt-3 text-center">

                      <span className="text-[11px] text-sky-700 block">

                      </span>

                  </div>

                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-sky-200">
                  <div>
                    <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sky-100 border border-sky-300 text-xs font-bold text-sky-700 mb-2">
                      <span>Step 2 of 3</span>
                    </div>
                    <h2 className="text-2xl sm:text-3xl font-black text-sky-950 tracking-tight">
                      Select Your Subscription Plan
                    </h2>
                    <p className="text-xs sm:text-sm text-sky-600 mt-0.5">
                      Choose the plan that powers your store. (Email: <strong>{email}</strong>)
                    </p>
                  </div>

                  {/* Previous Navigation Button */}
                  <button
                    type="button"
                    onClick={() => setStep('email')}
                    className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl border-2 border-sky-300 hover:border-sky-500 bg-white hover:bg-sky-50 text-xs font-bold text-sky-800 transition shadow-xs self-start sm:self-auto"
                  >
                    <Icons.ArrowLeft className="w-4 h-4 text-sky-600" />
                    <span>← Previous (Back to Email)</span>
                  </button>
                </div>

                {/* 3 Subscription Plan Cards */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-5 pt-2">
                  {/* Plan 1: Free */}
                  <div className={`p-6 rounded-2xl bg-white border-2 transition flex flex-col justify-between ${selectedPlan === 'free' ? 'border-sky-500 shadow-md ring-2 ring-sky-300' : 'border-sky-200 hover:border-sky-400'}`}>
                    <div className="space-y-4">
                      <span className="text-[10px] font-mono font-bold uppercase px-2.5 py-1 rounded-full bg-sky-100 text-sky-700 border border-sky-200 inline-block">
                        Stock Prediction
                      </span>
                      <div>
                        <h3 className="text-xl font-black text-sky-950">Free Plan</h3>
                        <div className="mt-1 flex items-baseline gap-1">
                          <span className="text-3xl font-black text-sky-950">₹0</span>
                          <span className="text-xs text-sky-600 font-bold">/ Lifetime Free</span>
                        </div>
                      </div>
                      <div className="space-y-2 text-xs text-sky-800 pt-2 border-t border-sky-100">

                          <span>Universal Gemini AI Stock Prediction</span>
                        </div>
                        <div className="flex items-start gap-2">
                          <span className="text-sky-500 font-bold">✓</span>
                          <span>POS Customer Billing (Stock Deduction)</span>
                        </div>
                        <div className="flex items-start gap-2">
                          <span className="text-sky-500 font-bold">✓</span>

                        </div>

    // 5. SIMPLE STOCK ASSISTANT VIEW (PREDICTIVE DEMAND FORECASTING POWERED BY GOOGLE GEMINI API)
    function SimpleStockAssistantView({ products, activeSectorObj, currentLang, navigateTo, speakText, openModal }) {
      const activeProducts = products || [];
      const [selectedSku, setSelectedSku] = useState(activeProducts[0]?.sku || '');
      
      const currentProduct = activeProducts.find(p => p.sku === selectedSku) || activeProducts[0] || {
        id: 'prod_default',
        name: 'Basmati Rice (50 kg Bag)',
        sku: 'GROC-RICE-001',
        category: 'Grains & Pulses',
        quantity: 120,
        unit: 'bags',
        dailyUsage: 50,
        minStockLevel: 40,
        leadTimeDays: 4,
        purchasePrice: 2200
      };

      const [customStock, setCustomStock] = useState(currentProduct.quantity);
      const [customUsage, setCustomUsage] = useState(currentProduct.dailyUsage);
      const [customLeadTime, setCustomLeadTime] = useState(currentProduct.leadTimeDays || 3);
      const [demandMultiplier, setDemandMultiplier] = useState(1.0);
      const [transitDelay, setTransitDelay] = useState(0);

      // Synchronous instant prediction calculation (0ms latency, zero buffering)
      const computeInstantForecast = (prod, stock, usage, lead, mult = 1.0, delay = 0) => {
        const effUsage = Math.max(1, Math.round((usage || 1) * mult));
        const effLead = Math.max(1, (lead || 1) + delay);
        const cov = (stock / effUsage).toFixed(1);
        const g = Math.max(0, effLead - cov);
        const crit = g > 0 || stock <= (prod?.minStockLevel || 10);
        return {
          predictedCoverageDays: parseFloat(cov),
          stockoutRiskLevel: stock === 0 ? 'CRITICAL' : g > 0 ? 'HIGH' : crit ? 'MODERATE' : 'HEALTHY',
          predictedStockoutDate: `In ${cov} days`,
          suggestedReorderQuantity: Math.max(0, Math.ceil(effUsage * (effLead + 3) - stock)),
          urgencyScore: stock === 0 ? 100 : g > 0 ? 85 : crit ? 60 : 20,
          aiReasoning: `Current stock of ${stock} ${prod?.unit || 'units'} covers ~${cov} days at ${effUsage} ${prod?.unit || 'units'}/day. Transit requires ${effLead} days.${g > 0 ? ` A supply deficit gap of ${g.toFixed(1)} days will cause a stockout before delivery.` : ' Stock buffer is sufficient.'}`,
          marketTrendFactor: `${activeSectorObj.name} regional trade patterns indicate stable demand baseline with typical replenishment cycles.`,
          recommendedAction: g > 0 ? `Immediate peer B2B sourcing recommended for ${Math.ceil(g * effUsage)} ${prod?.unit || 'units'} to cover the transit gap.` : `Maintain standard procurement cycle.`,
          isLiveGemini: false,
          modelUsed: 'SmartStock Operational AI Engine'
        };
      };

      const [isPredicting, setIsPredicting] = useState(false);
      const [prediction, setPrediction] = useState(() => computeInstantForecast(currentProduct, currentProduct.quantity, currentProduct.dailyUsage, currentProduct.leadTimeDays || 3));

      // Run cloud Gemini prediction function (with 4s timeout)
      const executePrediction = async (baseProd, stockVal, usageVal, leadVal, multVal, delayVal) => {
        setIsPredicting(true);
        try {
          const effectiveUsage = Math.max(1, Math.round((usageVal || 1) * multVal));
          const effectiveLeadTime = Math.max(1, (leadVal || 1) + delayVal);
          const virtualProd = {
            ...baseProd,
            quantity: stockVal,
            dailyUsage: effectiveUsage,
            leadTimeDays: effectiveLeadTime
          };

          const res = await GeminiService.predictProductDemand(virtualProd, activeSectorObj.name, currentLang);
          setPrediction(res);
        } catch (err) {
          console.warn('Gemini cloud prediction notice, using instant local engine:', err);
          setPrediction(computeInstantForecast(baseProd, stockVal, usageVal, leadVal, multVal, delayVal));
        } finally {
          setIsPredicting(false);
        }
      };

      // When product selector changes - update immediately with 0ms buffering
      const handleSelectSku = (sku) => {
        setSelectedSku(sku);
        const prod = activeProducts.find(p => p.sku === sku);
        if (prod) {
          setCustomStock(prod.quantity);
          setCustomUsage(prod.dailyUsage);
          setCustomLeadTime(prod.leadTimeDays || 3);
          setDemandMultiplier(1.0);
          setTransitDelay(0);
          setPrediction(computeInstantForecast(prod, prod.quantity, prod.dailyUsage, prod.leadTimeDays || 3, 1.0, 0));
        }
      };

      // Sync instant forecast when parameters or scenario toggles change (0ms latency)
      useEffect(() => {
        if (currentProduct) {
          setPrediction(prev => {
            if (prev?.isLiveGemini) return prev; // keep live Gemini if already run
            return computeInstantForecast(currentProduct, customStock, customUsage, customLeadTime, demandMultiplier, transitDelay);
          });
        }
      }, [selectedSku, customStock, customUsage, customLeadTime, demandMultiplier, transitDelay]);

      // Instant calculated metrics
      const effectiveUsage = Math.max(1, Math.round(customUsage * demandMultiplier));
      const effectiveLeadTime = Math.max(1, customLeadTime + transitDelay);
      const coverageDays = (customStock / effectiveUsage).toFixed(1);
      const deficitGap = (effectiveLeadTime - coverageDays).toFixed(1);
      const hasDeficit = deficitGap > 0;

      // Risk styling helpers
      const getRiskColor = (level) => {
        switch (level) {
          case 'CRITICAL': return 'bg-sky-100 text-sky-950 border-sky-400';
          case 'HIGH': return 'bg-sky-50 text-sky-900 border-sky-300';
          case 'MODERATE': return 'bg-sky-50 text-sky-800 border-sky-200';
          default: return 'bg-white text-sky-700 border-sky-200';
        }
      };

      return (
        <div className="space-y-6">
          {/* Header Section with Gemini Status & Key Action */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span className="p-1 rounded-lg bg-sky-500 text-white shadow-sm">
                  <Icons.Sparkles className="w-4 h-4 text-white" />

                <span className="text-xs font-mono font-bold text-sky-600 uppercase">

            <div className="flex flex-wrap items-center gap-2">
              <button

              >

                <span>New Customer Bill (POS)</span>
              </button>

              <button
                onClick={() => openModal && openModal('geminiApiKey')}
                className="px-3.5 py-2 rounded-xl bg-white border-2 border-sky-300 hover:border-sky-500 text-xs font-bold text-sky-900 flex items-center gap-2 shadow-sm transition"
              >
                <Icons.Sparkles className="w-4 h-4 text-sky-500" />
                <span>{GeminiService.hasApiKey() ? 'Gemini 1.5 Flash Active' : 'Deterministic Mode (Add Key)'}</span>
                <span className={`w-2 h-2 rounded-full ${GeminiService.hasApiKey() ? 'bg-sky-500 animate-pulse' : 'bg-sky-300'}`}></span>
              </button>

              <button
                onClick={() => {
                  const speech = prediction?.aiReasoning 
                    ? `${prediction.aiReasoning}. Recommended: ${prediction.recommendedAction}` 
                    : `Stock covers ${coverageDays} days. ${hasDeficit ? `Supply deficit gap of ${deficitGap} days.` : 'Buffer is sufficient.'}`;
                  speakText(speech);
                }}
                className="px-3.5 py-2 rounded-xl bg-sky-50 border border-sky-200 hover:bg-sky-100 text-xs font-bold text-sky-800 flex items-center gap-1.5 shadow-sm transition"
              >
                <Icons.Volume2 className="w-4 h-4 text-sky-500" />
                <span>{t('listenAloud', currentLang)}</span>
              </button>
            </div>
          </div>

          {/* REAL-TIME CONSUMER BILLING & DEMAND VELOCITY PIPELINE */}
          <div className="p-5 rounded-3xl bg-white border-2 border-sky-300 shadow-md space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <div className="p-2 rounded-xl bg-sky-500 text-white shadow-sm">
                  <Icons.FileText className="w-5 h-5 text-white" />
                </div>
                <div>
                  <h3 className="font-extrabold text-sm sm:text-base text-sky-950">
                    Live Consumer Billing & Real-Time Demand Pipeline
                  </h3>
                  <p className="text-xs text-sky-600">
                    Bills generated at the counter directly deduct stock and update Gemini's consumer depletion velocity.

                </div>
              </div>

              <button
                onClick={() => openModal && openModal('billing', null)}

            {(() => {

    function GeminiApiKeyModal({ closeModal, addToast, currentLang }) {
      const [keyInput, setKeyInput] = useState(GeminiService.getApiKey() || '');
      const [showKey, setShowKey] = useState(false);
      const [isTesting, setIsTesting] = useState(false);
      const [testResult, setTestResult] = useState(null);

      const hasLiveKey = Boolean(keyInput && keyInput.trim().length > 10);

      const handleSave = (e) => {
        if (e) e.preventDefault();
        const cleaned = keyInput.trim();
        GeminiService.setApiKey(cleaned);
        if (cleaned.length > 10) {
          if (addToast) addToast('Google Gemini 1.5 Flash API Key connected successfully!', 'Gemini Connected', 'success');
        } else {
          if (addToast) addToast('Switched to built-in transparent AI forecasting engine.', 'Engine Switched', 'info');
        }
        closeModal();
      };

      const handleTest = async () => {
        if (!keyInput.trim()) {
          setTestResult({ ok: false, error: 'Please enter an API key to test.' });
          return;
        }
        setIsTesting(true);
        setTestResult(null);
        try {
          const result = await GeminiService.testConnection(keyInput.trim());
          setTestResult(result);
          if (result.ok && addToast) {
            addToast(result.message, 'Connection Verified', 'success');
          }
        } catch (err) {
          setTestResult({ ok: false, error: err.message || 'Connection failed.' });
        } finally {
          setIsTesting(false);
        }
      };

      const handleClear = () => {
        GeminiService.setApiKey('');
        setKeyInput('');
        setTestResult(null);
        if (addToast) addToast('Gemini API Key removed. Using built-in deterministic AI engine.', 'Key Cleared', 'info');
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-sky-950/40 backdrop-blur-sm animate-fadeIn">
