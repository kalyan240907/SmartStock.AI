            <div className="mb-5 p-3.5 rounded-2xl bg-sky-50 border border-sky-200 flex items-center justify-between text-xs">
              <div className="flex items-center gap-2">
                <span className={`w-2.5 h-2.5 rounded-full ${GeminiService.hasApiKey() ? 'bg-sky-500 animate-pulse' : 'bg-sky-300'}`}></span>
                <span className="font-bold text-sky-900">
                  {GeminiService.hasApiKey() ? 'Live Gemini 1.5 Flash Connected' : 'Deterministic AI Engine Active (Default)'}
                </span>
              </div>
              <span className="text-[10px] font-mono font-bold text-sky-600 uppercase px-2 py-0.5 rounded bg-white border border-sky-200">
                {GeminiService.hasApiKey() ? 'Cloud AI' : 'Local Fallback'}
              </span>
            </div>

            {/* Key Input Form */}
            <form onSubmit={handleSave} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-sky-800 mb-1.5">
                  Gemini API Key (Google AI Studio)
                </label>
                <div className="relative">
                  <input
                    type={showKey ? 'text' : 'password'}
                    value={keyInput}
                    onChange={e => { setKeyInput(e.target.value); setTestResult(null); }}
                    placeholder="AIzaSy..."
                    className="w-full bg-sky-50 border border-sky-300 rounded-xl pl-3.5 pr-20 py-2.5 text-xs sm:text-sm font-mono text-sky-950 placeholder-sky-400 focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none"
                  />
                  <div className="absolute right-2 top-2 flex items-center gap-1">
                    <button
                      type="button"
                      onClick={() => setShowKey(!showKey)}
                      className="px-2 py-1 rounded-lg text-[10px] font-bold text-sky-600 hover:bg-sky-100 transition"
                      title={showKey ? 'Hide key' : 'Show key'}
                    >
                      {showKey ? 'Hide' : 'Show'}
                    </button>
                  </div>
                </div>
                <p className="text-[11px] text-sky-600 mt-1.5 leading-relaxed">
                  Keys are stored exclusively in your browser's private <code className="font-mono bg-sky-100 px-1 rounded text-sky-800">localStorage</code>. Never sent to any 3rd-party servers.
                </p>
              </div>

              {/* Test Connection Result Box */}
              {testResult && (
                <div className={`p-3 rounded-2xl text-xs flex items-start gap-2 border ${testResult.ok ? 'bg-sky-50 border-sky-400 text-sky-900' : 'bg-red-50 border-red-200 text-red-700'}`}>
                  {testResult.ok ? (
                    <Icons.CheckCircle className="w-4 h-4 text-sky-600 flex-shrink-0 mt-0.5" />
                  ) : (
                    <Icons.AlertTriangle className="w-4 h-4 text-red-500 flex-shrink-0 mt-0.5" />
                  )}
                  <div>
                    <span className="font-bold block">{testResult.ok ? 'Connection Verified' : 'Connection Failed'}</span>
                    <span className="text-[11px] leading-tight block mt-0.5">{testResult.message || testResult.error}</span>
                  </div>
                </div>
              )}

              {/* Free Key Instructions */}
              <div className="p-3.5 rounded-2xl bg-sky-50/70 border border-sky-200 text-xs text-sky-700 space-y-1">
                <span className="font-bold text-sky-900 flex items-center gap-1.5">
                  <Icons.HelpCircle className="w-3.5 h-3.5 text-sky-600" />
                  How to get your free Gemini API key:
                </span>
                <ol className="list-decimal list-inside text-[11px] space-y-0.5 text-sky-600 pt-0.5">
                  <li>Visit <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer" className="text-sky-700 underline font-semibold hover:text-sky-950">Google AI Studio (aistudio.google.com)</a></li>
                  <li>Sign in with your Google account and click <strong>"Create API Key"</strong></li>
                  <li>Paste the generated key (<code className="font-mono">AIzaSy...</code>) above and click <strong>Save & Connect</strong></li>
                </ol>
              </div>

              {/* Action Buttons */}
              <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-sky-200">
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={handleTest}
                    disabled={isTesting || !keyInput.trim()}
                    className="px-3 py-2 rounded-xl text-xs font-bold text-sky-700 bg-sky-50 border border-sky-300 hover:bg-sky-100 disabled:opacity-50 transition flex items-center gap-1"
                  >
                    {isTesting ? (
                      <>
                        <span className="w-3 h-3 rounded-full border-2 border-sky-600 border-t-transparent animate-spin"></span>
                        <span>Testing...</span>
                      </>
                    ) : (
                      <>
                        <Icons.Zap className="w-3.5 h-3.5 text-sky-600" />
                        <span>Test Connection</span>
                      </>
                    )}
                  </button>

                  {hasLiveKey && (
                    <button
                      type="button"
                      onClick={handleClear}
                      className="px-3 py-2 rounded-xl text-xs font-bold text-sky-600 hover:text-sky-900 hover:bg-sky-50 transition"
                    >
                      Clear
                    </button>
                  )}
                </div>

                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={closeModal}
                    className="px-4 py-2 rounded-xl text-xs font-bold text-sky-700 bg-white border border-sky-300 hover:bg-sky-50"
                  >
                    {t('cancel', currentLang)}
                  </button>
                  <button
                    type="submit"
                    className="px-5 py-2 rounded-xl text-xs font-bold bg-sky-500 text-white hover:bg-sky-600 shadow-md shadow-sky-500/20 transition"
                  >
                    Save & Connect
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // 12. SMART BILLING & POS COUNTER MODAL (DIRECT STOCK DEDUCTION & AI CONSUMER PREDICTION)
    function SmartBillingModal({ products, activeSector, currentLang, closeModal, addToast, navigateTo, speakText }) {
      const activeProducts = (products || []).filter(p => !activeSector || p.sector === activeSector);
      
      const [customerName, setCustomerName] = useState('Walk-in Consumer');
      const [customerPhone, setCustomerPhone] = useState('');
      const [paymentMethod, setPaymentMethod] = useState('Cash');
      const [cart, setCart] = useState([]);
      
      const [selectedProdId, setSelectedProdId] = useState(activeProducts[0]?.id || '');
      const [inputQty, setInputQty] = useState(1);
      
      const currentSelectedProduct = activeProducts.find(p => p.id === selectedProdId) || activeProducts[0];
      const maxAvailableStock = currentSelectedProduct ? currentSelectedProduct.quantity : 0;

      const [isProcessing, setIsProcessing] = useState(false);
      const [completedBill, setCompletedBill] = useState(null);
      const [aiConsumerPrediction, setAiConsumerPrediction] = useState(null);

      // Add item to cart
      const handleAddToCart = () => {
        if (!currentSelectedProduct) return;
        const qty = parseFloat(inputQty);
        if (isNaN(qty) || qty <= 0) {
          if (addToast) addToast('Please enter a valid quantity.', 'Invalid Qty', 'error');
          return;
        }

        const existingItem = cart.find(i => i.productId === currentSelectedProduct.id);
        const currentInCart = existingItem ? existingItem.quantity : 0;
        if (currentInCart + qty > currentSelectedProduct.quantity) {
          if (addToast) addToast(`Cannot add ${qty} ${currentSelectedProduct.unit}. Only ${currentSelectedProduct.quantity} available on hand.`, 'Stock Limit Exceeded', 'error');
          return;
        }

        const unitPrice = currentSelectedProduct.purchasePrice || 100;

        if (existingItem) {
          setCart(cart.map(i => i.productId === currentSelectedProduct.id 
            ? { ...i, quantity: i.quantity + qty, lineTotal: (i.quantity + qty) * unitPrice }
            : i
          ));
        } else {
          setCart([...cart, {
            productId: currentSelectedProduct.id,
            sku: currentSelectedProduct.sku,
            name: currentSelectedProduct.name,
            unit: currentSelectedProduct.unit,
            unitPrice: unitPrice,
            quantity: qty,
            lineTotal: qty * unitPrice,
            availableStock: currentSelectedProduct.quantity
          }]);
        }
        setInputQty(1);
      };

      const handleRemoveFromCart = (productId) => {
        setCart(cart.filter(i => i.productId !== productId));
      };

      const subtotal = cart.reduce((acc, i) => acc + (i.lineTotal || 0), 0);
      const gstTax = parseFloat((subtotal * 0.05).toFixed(2));
      const grandTotal = parseFloat((subtotal + gstTax).toFixed(2));

      // Handle Bill Generation & direct AI update
      const handleGenerateBill = async (e) => {
        if (e) e.preventDefault();
        if (cart.length === 0) {
          if (addToast) addToast('Please add at least one product to the bill before confirming.', 'Empty Bill', 'error');
          return;
        }

        setIsProcessing(true);
        try {
          // 1. Atomically deduct stock from inventory
          const billRecord = StorageService.recordCustomerBill({
            customerName: customerName.trim() || 'Walk-in Consumer',
            customerPhone: customerPhone.trim() || 'N/A',
            items: cart,
            paymentMethod
          });

          setCompletedBill(billRecord);
          if (addToast) {
            addToast(`Bill #${billRecord.invoiceNo} completed! Stock deducted directly.`, 'Bill Generated', 'success');
          }

          // 2. Feed directly to Google Gemini AI to forecast consumer demand & rush
          const prediction = await GeminiService.predictConsumerDemandFromBill(
            billRecord,
            StorageService.getProducts(),
            activeSector,
            currentLang
          );
          setAiConsumerPrediction(prediction);

          // 3. Audio confirmation
          if (speakText && prediction?.consumerStockoutTimeline) {
            speakText(`Bill generated for ${customerName}. ${prediction.consumerStockoutTimeline}`);
          }
        } catch (err) {
          console.error(err);
          if (addToast) addToast(err.message || 'Billing failed', 'Error', 'error');
        } finally {
          setIsProcessing(false);
        }
      };

      const handleResetNewBill = () => {
        setCompletedBill(null);
        setAiConsumerPrediction(null);
        setCart([]);
        setCustomerName('Walk-in Consumer');
        setCustomerPhone('');
        setInputQty(1);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-sky-950/40 backdrop-blur-sm animate-fadeIn overflow-y-auto">
          <div className="w-full max-w-3xl bg-white rounded-3xl border-2 border-sky-300 shadow-2xl p-6 sm:p-7 relative text-sky-950 my-8 max-h-[90vh] overflow-y-auto">
            {/* Modal Header */}
            <div className="flex items-start justify-between gap-3 pb-3 border-b border-sky-200 mb-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-sky-500 flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                  <Icons.FileText className="w-5 h-5 text-white" />
                </div>
                <div>
                  <h3 className="text-lg font-black text-sky-950 tracking-tight">Customer Billing Counter & POS</h3>
                  <p className="text-xs text-sky-600">Deducts stock on-hand directly & streams sales velocity to Gemini AI</p>
                </div>
              </div>
              <button onClick={closeModal} className="p-1.5 rounded-xl text-sky-400 hover:text-sky-700 hover:bg-sky-50 transition">
                <Icons.X className="w-5 h-5" />
              </button>
            </div>

            {completedBill ? (
              /* --- STATE B: COMPLETED BILL & GEMINI CONSUMER PREDICTION --- */
              <div className="space-y-5 animate-fadeIn">
                {/* Success Banner */}
                <div className="p-4 rounded-2xl bg-sky-50 border-2 border-sky-400 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div className="flex items-center gap-3">
                    <div className="p-2 rounded-xl bg-sky-500 text-white">
                      <Icons.CheckCircle className="w-5 h-5 text-white" />
                    </div>
                    <div>
                      <h4 className="font-extrabold text-sky-950 text-sm sm:text-base">
                        Bill #{completedBill.invoiceNo} Generated Successfully!
                      </h4>
                      <p className="text-xs text-sky-700">
                        Stock deducted directly from inventory • {completedBill.date} {completedBill.time}
                      </p>
                    </div>
                  </div>
                  <div className="text-right">
                    <span className="text-xs text-sky-600 block">Total Amount</span>
                    <span className="text-xl font-black text-sky-950">₹{completedBill.grandTotal}</span>
                  </div>
                </div>

                {/* Gemini AI Consumer Demand & Stockout Forecast Card */}
                {aiConsumerPrediction && (
                  <div className="p-5 rounded-3xl bg-white border-2 border-sky-300 shadow-lg space-y-4">
                    <div className="flex items-center justify-between pb-2 border-b border-sky-100">
                      <div className="flex items-center gap-2">
                        <Icons.Sparkles className="w-4 h-4 text-sky-500" />
                        <h4 className="font-bold text-sm text-sky-950">
                          {aiConsumerPrediction.modelUsed} Consumer Demand Forecast
                        </h4>
                      </div>
                      <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-sky-100 text-sky-800 border border-sky-300">
                        {aiConsumerPrediction.velocityStatus}
                      </span>
                    </div>

                    {/* 3 Metric Pills */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div className="p-3 rounded-2xl bg-sky-50 border border-sky-200">
                        <span className="text-[10px] font-mono font-bold text-sky-600 uppercase block">Consumer Availability</span>
                        <span className="text-xs font-bold text-sky-950 mt-1 block">
                          {aiConsumerPrediction.consumerAvailabilityNotice}
                        </span>
                      </div>

                      <div className="p-3 rounded-2xl bg-sky-50 border border-sky-200">
                        <span className="text-[10px] font-mono font-bold text-sky-600 uppercase block">Stockout Timeline</span>
                        <span className="text-xs font-bold text-sky-950 mt-1 block">
                          {aiConsumerPrediction.consumerStockoutTimeline}
                        </span>
                      </div>

                      <div className="p-3 rounded-2xl bg-sky-50 border border-sky-200">
                        <span className="text-[10px] font-mono font-bold text-sky-600 uppercase block">Projected Peak Rush</span>
                        <span className="text-xs font-bold text-sky-950 mt-1 block">
                          {aiConsumerPrediction.consumerRushPrediction}
                        </span>
                      </div>
                    </div>

                    {/* Consumer Basket Co-Purchase Recommendations */}
                    {aiConsumerPrediction.basketRecommendations && aiConsumerPrediction.basketRecommendations.length > 0 && (
                      <div className="p-3.5 rounded-2xl bg-sky-50/70 border border-sky-200 text-xs">
                        <span className="font-bold text-sky-900 block mb-1.5">
                          🛒 Consumers Buying These Items Also Purchase:
                        </span>
                        <div className="flex flex-wrap gap-1.5">
                          {aiConsumerPrediction.basketRecommendations.map((item, idx) => (
                            <span key={idx} className="px-2.5 py-1 rounded-lg bg-white border border-sky-300 font-semibold text-sky-800 text-xs shadow-sm">
                              + {item}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* AI Explanation & Advice */}
                    <p className="text-xs text-sky-950 leading-relaxed bg-sky-50 p-3 rounded-xl border border-sky-100">
                      <strong>AI Supply Chain Reasoning:</strong> {aiConsumerPrediction.aiExplanation}
                    </p>

                    <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-sky-100">
                      <button
                        onClick={() => speakText(`${aiConsumerPrediction.consumerStockoutTimeline}. ${aiConsumerPrediction.recommendedAction}`)}
                        className="px-3 py-1.5 rounded-xl bg-white border border-sky-300 text-xs font-bold text-sky-800 hover:bg-sky-50 flex items-center gap-1.5"
                      >
                        <Icons.Volume2 className="w-4 h-4 text-sky-500" />
                        <span>Listen to Prediction</span>
                      </button>

                      <button
                        onClick={() => { closeModal(); navigateTo('trade-network'); }}
                        className="px-3.5 py-1.5 rounded-xl bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold shadow-sm transition"
                      >
                        Sourcing Buffer from Peer Suppliers →
                      </button>
                    </div>
                  </div>
                )}

                {/* Printable Bill Receipt Box */}
                <div className="p-5 rounded-2xl bg-white border-2 border-sky-200 shadow-sm space-y-3 font-mono text-xs text-sky-950">
                  <div className="text-center border-b border-sky-200 pb-2">
                    <h4 className="font-black text-sm tracking-tight text-sky-950">SMARTSTOCK RETAIL INVOICE</h4>
                    <p className="text-[11px] text-sky-600 font-sans">Invoice #: {completedBill.invoiceNo} • Date: {completedBill.date} {completedBill.time}</p>
                    <p className="text-[11px] text-sky-700 font-sans">Customer: {completedBill.customerName} ({completedBill.customerPhone}) • Payment: {completedBill.paymentMethod}</p>
                  </div>

                  <table className="w-full text-left">
                    <thead>
                      <tr className="border-b border-sky-200 text-sky-700 text-[11px]">
                        <th className="py-1">Item Description</th>
                        <th className="py-1 text-center">Qty</th>
                        <th className="py-1 text-right">Price</th>
                        <th className="py-1 text-right">Amount</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-sky-100">
                      {completedBill.items.map((it, idx) => (
                        <tr key={idx}>
                          <td className="py-1.5 font-bold font-sans">{it.name}</td>
                          <td className="py-1.5 text-center">{it.quantity} {it.unit}</td>
                          <td className="py-1.5 text-right">₹{it.unitPrice}</td>
                          <td className="py-1.5 text-right font-bold">₹{it.lineTotal}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="border-t border-sky-200 pt-2 space-y-1 text-right text-xs">
                    <div>Subtotal: <strong>₹{completedBill.subtotal}</strong></div>
                    <div>GST (5%): <strong>₹{completedBill.tax}</strong></div>
                    <div className="text-sm font-black text-sky-950">Grand Total: ₹{completedBill.grandTotal}</div>
                  </div>
                </div>

                {/* Bottom Actions */}
                <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-sky-200">
                  <button
                    onClick={() => window.print()}
                    className="px-4 py-2 rounded-xl bg-white border border-sky-300 text-sky-800 hover:bg-sky-50 text-xs font-bold shadow-sm transition flex items-center gap-1.5"
                  >
                    <span>🖨️ Print Customer Receipt</span>
                  </button>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleResetNewBill}
                      className="px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold shadow-md transition"
                    >
                      + Create Another Bill
                    </button>
                    <button
                      onClick={closeModal}
                      className="px-4 py-2 rounded-xl bg-white border border-sky-300 text-sky-700 hover:bg-sky-50 text-xs font-bold transition"
                    >
                      Close
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              /* --- STATE A: BILL CREATION POS COUNTER --- */
              <form onSubmit={handleGenerateBill} className="space-y-4">
                {/* Customer Details Row */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 p-3.5 rounded-2xl bg-sky-50 border border-sky-200 text-xs">
                  <div>
                    <label className="block text-sky-800 font-bold mb-1">Customer Name</label>
                    <input
                      type="text"
                      value={customerName}
                      onChange={e => setCustomerName(e.target.value)}
                      placeholder="e.g. Ramesh Kumar"
                      className="w-full bg-white border border-sky-200 rounded-xl px-3 py-1.5 text-sky-950 font-medium focus:border-sky-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-sky-800 font-bold mb-1">Mobile Number (Optional)</label>
                    <input
                      type="text"
                      value={customerPhone}
                      onChange={e => setCustomerPhone(e.target.value)}
                      placeholder="+91 98765 43210"
                      className="w-full bg-white border border-sky-200 rounded-xl px-3 py-1.5 text-sky-950 font-medium focus:border-sky-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-sky-800 font-bold mb-1">Payment Method</label>
                    <select
                      value={paymentMethod}
                      onChange={e => setPaymentMethod(e.target.value)}
                      className="w-full bg-white border border-sky-200 rounded-xl px-3 py-1.5 text-sky-950 font-bold focus:border-sky-500 outline-none cursor-pointer"
                    >
                      <option value="Cash">Cash</option>
                      <option value="UPI / QR Code">UPI / QR Code</option>
                      <option value="Card">Card</option>
                      <option value="Store Credit">Store Credit</option>
                    </select>
                  </div>
                </div>

                {/* Item Selector & Add to Cart */}
                <div className="p-4 rounded-2xl bg-white border-2 border-sky-300 shadow-sm space-y-3">
                  <div className="flex items-center justify-between pb-1 border-b border-sky-100">
                    <span className="text-xs font-mono font-bold text-sky-600 uppercase">Select Installed Product</span>
                    <span className="text-[11px] font-bold text-sky-800">
                      Stock on hand: {maxAvailableStock} {currentSelectedProduct?.unit || ''}
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
                    <div className="sm:col-span-7">
                      <label className="block text-xs font-semibold text-sky-800 mb-1">Catalog Product</label>
                      <select
                        value={selectedProdId}
                        onChange={e => setSelectedProdId(e.target.value)}
                        className="w-full bg-sky-50 border border-sky-200 rounded-xl px-3 py-2 text-xs sm:text-sm font-bold text-sky-950 focus:bg-white focus:border-sky-500 outline-none cursor-pointer"
                      >
                        {activeProducts.map(p => (
                          <option key={p.id} value={p.id}>
                            {p.name} ({p.quantity} {p.unit} in stock) - ₹{p.purchasePrice}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="sm:col-span-3">
                      <label className="block text-xs font-semibold text-sky-800 mb-1">
                        Quantity ({currentSelectedProduct?.unit})
                      </label>
                      <input
                        type="number"
                        min="1"
                        max={maxAvailableStock}
                        value={inputQty}
                        onChange={e => setInputQty(parseFloat(e.target.value) || 1)}
                        className="w-full bg-sky-50 border border-sky-200 rounded-xl px-3 py-2 text-xs sm:text-sm font-bold text-sky-950 focus:bg-white focus:border-sky-500 outline-none"
                      />
                    </div>

                    <div className="sm:col-span-2">
                      <button
                        type="button"
                        onClick={handleAddToCart}
                        disabled={maxAvailableStock <= 0}
                        className="w-full py-2 px-3 rounded-xl bg-sky-500 hover:bg-sky-600 disabled:opacity-50 text-white font-bold text-xs shadow-md transition"
                      >
                        + Add Item
                      </button>
                    </div>
                  </div>
                </div>

                {/* Cart Items List */}
                <div className="p-4 rounded-2xl bg-white border border-sky-200 shadow-sm space-y-3">
                  <span className="text-xs font-mono font-bold text-sky-600 uppercase block">
                    Billed Items Cart ({cart.length} items)
                  </span>

                  {cart.length === 0 ? (
                    <div className="p-6 text-center text-xs text-sky-600 border border-dashed border-sky-200 rounded-xl">
                      Select items above and click "+ Add Item" to build the customer bill.
                    </div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead>
                          <tr className="border-b border-sky-200 text-sky-700 font-bold uppercase text-[10px]">
                            <th className="py-2">Product Name</th>
                            <th className="py-2 text-center">Billed Qty</th>
                            <th className="py-2 text-right">Price</th>
                            <th className="py-2 text-right">Line Total</th>
                            <th className="py-2 text-right">Action</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-sky-100 font-medium">
                          {cart.map(item => (
                            <tr key={item.productId} className="hover:bg-sky-50/50">
                              <td className="py-2 font-bold text-sky-950">{item.name}</td>
                              <td className="py-2 text-center">{item.quantity} {item.unit}</td>
                              <td className="py-2 text-right">₹{item.unitPrice}</td>
                              <td className="py-2 text-right font-bold text-sky-950">₹{item.lineTotal}</td>
                              <td className="py-2 text-right">
                                <button
                                  type="button"
                                  onClick={() => handleRemoveFromCart(item.productId)}
                                  className="text-sky-400 hover:text-red-500 p-1"
                                >
                                  <Icons.Trash className="w-4 h-4" />
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}

                  {/* Bill Totals Summary */}
                  {cart.length > 0 && (
                    <div className="p-3 rounded-xl bg-sky-50 border border-sky-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                      <div className="space-x-4 text-sky-700">
                        <span>Subtotal: <strong>₹{subtotal}</strong></span>
                        <span>GST (5%): <strong>₹{gstTax}</strong></span>
                      </div>
                      <div className="text-base font-black text-sky-950">
                        Grand Total: ₹{grandTotal}
                      </div>
                    </div>
                  )}
                </div>

                {/* Modal Footer Actions */}
                <div className="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-sky-200">
                  <div className="text-xs text-sky-600">
                    <span className="font-bold text-sky-800">⚡ Direct AI Sync:</span> Stock will be deducted and consumer demand updated immediately.
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={closeModal}
                      className="px-4 py-2 rounded-xl text-xs font-bold text-sky-700 bg-white border border-sky-300 hover:bg-sky-50"
                    >
                      {t('cancel', currentLang)}
                    </button>
                    <button
                      type="submit"
                      disabled={isProcessing || cart.length === 0}
                      className="px-5 py-2.5 rounded-xl text-xs font-bold bg-sky-500 hover:bg-sky-600 disabled:opacity-50 text-white shadow-md shadow-sky-500/20 transition flex items-center gap-2"
                    >
                      {isProcessing ? (
                        <>
                          <span className="w-3.5 h-3.5 rounded-full border-2 border-white border-t-transparent animate-spin"></span>
                          <span>Updating Stock & AI...</span>
                        </>
                      ) : (
                        <>
                          <Icons.Sparkles className="w-4 h-4 text-white" />
                          <span>Generate Bill & Update AI</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
